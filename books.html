<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Books — Coach Tejaswi</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      background: #ece6d8;
      color: #1d1d1d;
      margin: 0;
      font-family: Inter, sans-serif;
    }

    .home-shell {
      max-width: 1240px;
      margin: auto;
      padding: 0 24px 100px;
    }

    .minimal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
    }

    .brand-sub {
      color: #666;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .minimal-nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .minimal-nav a {
      text-decoration: none;
      color: #1d1d1d;
      font-size: 0.95rem;
    }

    .page-hero {
      padding: 42px 0 56px;
      text-align: center;
    }

    .page-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .page-hero p {
      max-width: 760px;
      margin: auto;
      line-height: 1.9;
      color: #555;
      font-size: 1.08rem;
    }

    .books-grid {
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .book-card {
      background: rgba(255,255,255,0.35);
      border-radius: 32px;
      padding: 42px;
      border: 1px solid rgba(0,0,0,0.05);
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 42px;
      align-items: start;
    }

    .book-cover img {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    }

    .available {
      color: #777;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .book-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .book-content h3 {
      font-size: 1rem;
      color: #666;
      margin-bottom: 24px;
      font-weight: 400;
    }

    .book-content p {
      line-height: 1.95;
      color: #333;
      margin-bottom: 26px;
      font-size: 1rem;
    }

    .ctas {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 40px;
      text-decoration: none;
      background: #1d1d1d;
      color: #ece6d8;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-secondary {
      background: transparent;
      color: #1d1d1d;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      background: white;
      min-width: 220px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      padding: 8px 0;
      margin-top: 8px;
      z-index: 20;
    }

    .dropdown-menu li {
      list-style: none;
    }

    .dropdown-menu li a {
      display: block;
      padding: 12px 18px;
      text-decoration: none;
      color: #333;
    }

    .dropdown-menu li a:hover {
      background: #f5eee2;
    }

    @media(max-width: 900px){
      .minimal-header {
        flex-direction: column;
        gap: 20px;
      }

      .book-card {
        grid-template-columns: 1fr;
      }

      .book-cover {
        max-width: 320px;
        margin: auto;
      }

      .page-hero h1 {
        font-size: 3.6rem;
      }
    }

    @media(max-width: 640px){
      .minimal-nav {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .page-hero h1 {
        font-size: 2.8rem;
      }

      .book-content h2 {
        font-size: 2.2rem;
      }

      .book-card {
        padding: 28px;
      }
    }
  </style>
</head>
<body>
<div class="home-shell">
<header class="minimal-header">
  <div>
    <div class="brand-title">Coach Tejaswi</div>
    <div class="brand-sub">Quietwork • Reflections • Personal Growth</div>
  </div>

  <nav class="minimal-nav">
    <a href="/">Home</a>
    <a href="/embracing-failure">Embracing Failure</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="https://coachtejaswi.substack.com/" target="_blank">Reflections</a>
  </nav>
</header>
<section class="page-hero">
  <h1>Books</h1>
  <p>
    Reflections, stories, emotional resilience, mindfulness, and personal transformation —
    a growing library for thoughtful readers navigating modern life.
  </p>
</section>
<section class="books-grid">
<!-- content unchanged -->
</section>
</div>
<script>
function toggleMenu(id){
  document.querySelectorAll('.dropdown-menu').forEach(menu => {
    if(menu.id !== id) menu.style.display = 'none';
  });
  const menu = document.getElementById(id);
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
window.addEventListener('click', function(e){
  if(!e.target.closest('.dropdown')){
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
      menu.style.display = 'none';
    });
  }
});
</script>
</body>
</html>
